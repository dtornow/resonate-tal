SPECIFICATION ConcreteBehavior

CONSTANTS
    Origin       = {"o1"}
    Rest         = {"a", "b"}
    Address      = {"addr1"}
    Pid          = {"pid1"}
    Value        = {"val"}
    Rid          = {"q1", "q2"}
    Implemented  = {"PromiseCreate", "PromiseSettle", "PromiseRegisterCallback",
                    "PromiseRegisterListener", "TaskCreate", "TaskAcquire",
                    "TaskFence", "TaskHeartbeat", "TaskSuspend", "TaskFulfill",
                    "TaskRelease", "TaskHalt", "TaskContinue", "Timeout"}
    Ttl          = {1}
    NoPid        = "nopid"
    NoAddr       = "noaddr"
    NoValue      = "noval"

    RetryDelay   = 2
    MaxTime      = 1
    MaxVersion   = 1

CONSTRAINT
    C_NowBound
    C_VersionBound

INVARIANT
    C_TypeOK
    C_UnitCoherent
    C_WheelComplete

PROPERTY
    AbstractSafety
