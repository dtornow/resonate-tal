SPECIFICATION ConcreteSafety

CONSTANTS
    Origin       = {"o1"}
    Rest         = {"a"}
    Address      = {"addr1"}
    Pid          = {"pid1"}
    Value        = {"val"}
    Rid          = {"q1"}
    Implemented  = {"PromiseCreate", "PromiseSettle",
                    "PromiseRegisterListener", "Timeout"}
    Ttl          = {1}
    NoPid        = "nopid"
    NoAddr       = "noaddr"
    NoValue      = "noval"

    RetryTimeout = 2
    MaxTime      = 1
    MaxVersion   = 1

CONSTRAINT
    NowBound
    VersionBound

INVARIANT
    TypeOK

PROPERTY
    BatchedSafety

CHECK_DEADLOCK FALSE
