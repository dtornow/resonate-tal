\* Focused complete-state check for the physical storage schema in C_TypeOK.
INIT Init
NEXT Next

CONSTANTS
    Origin       = {"o1"}
    Rest         = {"a"}
    Address      = {"addr1"}
    Pid          = {"pid1"}
    Value        = {"val"}
    Rid          = {"q1"}
    Implemented  = {"PromiseCreate", "PromiseSettle", "PromiseRegisterCallback",
                    "PromiseRegisterListener", "TaskCreate", "TaskAcquire",
                    "TaskFence", "TaskHeartbeat", "TaskSuspend", "TaskFulfill",
                    "TaskRelease", "TaskHalt", "TaskContinue", "Timeout"}
    Ttl          = {1}
    NoPid        = "nopid"
    NoAddr       = "noaddr"
    NoValue      = "noval"
    RetryDelay   = 2
    MaxTime      = 1
    MaxVersion   = 1

CONSTRAINT
    C_NowBound
    C_VersionBound

INVARIANT
    BlobShapeOK
    WorkflowStorageTypeOK
    TimerStorageTypeOK
    C_TypeOK

CHECK_DEADLOCK FALSE
